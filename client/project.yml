# The nfsu2.xyz client app, made with XcodeGen (cd client && xcodegen).
# GitHub builds it (.github/workflows/client.yml) unsigned: sign it when you
# install it (Sideloadly or AltStore, with your Apple ID).
name: NFSU2Client
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  NFSU2Client:
    type: application
    platform: iOS
    sources:
      - path: App.swift
      - path: Assets.xcassets
      - path: Info.plist
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: NFSU2
        PRODUCT_BUNDLE_IDENTIFIER: io.github.gabe4tw.nfsu2client
        PRODUCT_MODULE_NAME: NFSU2Client
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
